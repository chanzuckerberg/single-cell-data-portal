name: Build application images

on:
  workflow_call:
    outputs:
      image_tag:
        description: "the image tag to be pushed"
        value: ${{ jobs.build_images.outputs.image_tag }}
env:
  # Force using BuildKit instead of normal Docker, required so that metadata
  # is written/read to allow us to use layers of previous builds as cache.
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  DOCKER_REPO: ${{ secrets.ECR_REPO }}/

permissions:
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  build_images:
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            repository: corpora-frontend
            profile: fullstack
          - service: backend
            repository: corpora-backend
            profile: backend
          - service: backend-de
            repository: corpora-backend-de
            profile: backend
          - service: backend-wmg
            repository: corpora-backend-wmg
            profile: backend
          - service: upload_failures
            repository: corpora-upload-failures
            profile: upload_failures
          - service: upload_success
            repository: corpora-upload-success
            profile: upload_success
          - service: processing
            repository: corpora-upload
            profile: processing
          - service: wmg_processing
            repository: wmg-processing
            profile: wmg_processing
          - service: cellguide_pipeline
            repository: cellguide-pipeline
            profile: cellguide_pipeline
    runs-on: ubuntu-26.04
    outputs:
      image_tag: ${{ steps.push_images.outputs.image_tag }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-duration-seconds: 1800
      - name: Login to ECR
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ECR_REPO }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Push images
        id: push_images
        run: |
          export IMAGE_TAG=sha-${GITHUB_SHA:0:8}
          export BRANCH_TAG=branch-$(echo ${GITHUB_REF_NAME} | sed 's/[\+\/]/-/g')
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          scripts/build-images.sh \
            "${{ matrix.service }}" \
            "${{ matrix.repository }}" \
            "${{ matrix.profile }}" \
            "${IMAGE_TAG}" \
            "${BRANCH_TAG}" \
            "${GITHUB_SHA}" \
            "${GITHUB_REF_NAME}"
      - uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,commit,author,eventName,workflow,job,mention
          mention: "here"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        if: failure() && (github.ref_name == 'main' || github.ref_name == 'staging' || github.ref_name == 'prod')
